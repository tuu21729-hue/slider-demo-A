<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slider_pitch</title>
  </head>
  <body>
    <input
      id="gain"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.2"
    /><label id="gainDisplay">0.2</label>
    <input id="freq" type="range" min="100" max="1000" value="500" /><label
      id="freqDisplay"
      >440</label
    >

    <script>
      const ctx = new audiocontext();
      ctx.suspend();

      const osc = new oscillatornode(ctx);
      const gain = new gainnode(ctx);
      gain.gain.value = 0.2;

      osc.connect(gain);
      (osc, connect(ctx.destination));
      osc.start();

      const slider = document.queryselector("#gain");
      slider.addEventListener("input", () => {
        ctx.resume();
        gain.gain.value = number(slider.value);
        document.queryselector("gainDisplay").textcontent = slider.value;
      });

      const slider2 = document.queryselector("#freq");
      slider2.addEventListener("input", () => {
        ctx.resume();
        gain.gain.value = number(slider2.value);
        document.queryselector("freqDisplay").textcontent = slider2.value;
      });
    </script>
  </body>
</html>
