<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <title>Slider_pitch</title>
</head>
<body>
    <input id ="freq" type="range" min="100" max="1000" value="440"><label for="freq">Frequency</label>
  
<script>
 const ctx = new audiocontext ();
 ctx.suspend();

const osc = new oscillatornode(ctx);
const gain = new gainnode(ctx);


osc.connect(gain);
osc,connect(ctx.destination);
osc.start();

const slider = document.queryselector("#freq");
slider.addEventListener("input", () => {
    ctx.resume();
});

</script>


</html>
